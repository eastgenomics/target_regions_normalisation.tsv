name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python3 -m py_compile build_target_regions_normalisation.py
      - name: Unit tests
        run: pip install "pytest==8.3.4" dxpy && pytest test_build_target_regions_normalisation.py -v
